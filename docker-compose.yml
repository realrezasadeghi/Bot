services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_scheduling}
      POSTGRES_USER: ${POSTGRES_USER:-academic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "dist/cli/migrate.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-academic}:${POSTGRES_PASSWORD:-academic}@postgres:5432/${POSTGRES_DB:-academic_scheduling}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  http:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-academic}:${POSTGRES_PASSWORD:-academic}@postgres:5432/${POSTGRES_DB:-academic_scheduling}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-academic}:${POSTGRES_PASSWORD:-academic}@postgres:5432/${POSTGRES_DB:-academic_scheduling}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
