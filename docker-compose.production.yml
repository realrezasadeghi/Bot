
name: academic-scheduling-bot

services:

  # 1. PostgreSQL
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped
    stop_grace_period: 1m


  # 2. Database Migration
  migrate:
    image: ghcr.io/realrezasadeghi/bot:${IMAGE_TAG:?IMAGE_TAG is required}

    command:
      - node
      - dist/cli/migrate.js

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: "1"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"
    init: true


  # 3. HTTP Server
  http:
    image: ghcr.io/realrezasadeghi/bot:${IMAGE_TAG:?IMAGE_TAG is required}

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: "4"

    ports:
      - "127.0.0.1:${HTTP_HOST_PORT:-3000}:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped
    stop_grace_period: 15s
    init: true


  # 4. Background Worker
  worker:
    image: ghcr.io/realrezasadeghi/bot:${IMAGE_TAG:?IMAGE_TAG is required}

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: "4"

    command:
      - node
      - dist/bootstrap/worker.js

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped
    stop_grace_period: 30s
    init: true


volumes:
  postgres-data:
