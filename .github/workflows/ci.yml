
name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to verify and republish (e.g. v0.1.1)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.4.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/realrezasadeghi/bot

# Cancel outdated PR checks, but never cancel an ongoing master release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # --------------------------------------------------
  # 1. Lint and Typecheck
  # --------------------------------------------------

  lint_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck


  # --------------------------------------------------
  # 2. PostgreSQL Integration Tests
  # --------------------------------------------------

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: academic_scheduling
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U academic -d academic_scheduling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://academic:academic@localhost:5432/academic_scheduling
        run: pnpm test


  # --------------------------------------------------
  # 3. Application Build
  # --------------------------------------------------

  build:
    name: Application Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build


  # --------------------------------------------------
  # 4. Docker Build Verification
  # --------------------------------------------------

  container_build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - lint_typecheck
      - test
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Validate Docker image build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=academic-scheduling-bot


  # --------------------------------------------------
  # 5. Semantic Release
  # --------------------------------------------------

  release:
    name: Semantic Release

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    needs:
      - lint_typecheck
      - test
      - build
      - container_build

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: semantic-release-master
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.detect_release.outputs.released }}
      tag: ${{ steps.detect_release.outputs.tag }}
      version: ${{ steps.detect_release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Snapshot tags before semantic-release.
      - name: Snapshot existing release tags
        shell: bash
        run: |
          set -euo pipefail

          LC_ALL=C git tag --list 'v[0-9]*' |
            LC_ALL=C sort > "$RUNNER_TEMP/tags-before.txt"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # Detect the exact tag created by this release execution.
      - name: Detect newly created release
        id: detect_release
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          LC_ALL=C git tag --list 'v[0-9]*' |
            LC_ALL=C sort > "$RUNNER_TEMP/tags-after.txt"

          mapfile -t new_tags < <(
            comm -13 \
              "$RUNNER_TEMP/tags-before.txt" \
              "$RUNNER_TEMP/tags-after.txt"
          )

          if [[ ${#new_tags[@]} -eq 0 ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release was created."
            exit 0
          fi

          if [[ ${#new_tags[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one new release tag."
            exit 1
          fi

          tag="${new_tags[0]}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          commit="$(git rev-parse "${tag}^{commit}")"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "New release detected:"
          echo "Tag: $tag"
          echo "Version: $version"
          echo "Commit: $commit"


  # --------------------------------------------------
  # 6. Publish Multi-Architecture Docker Image to GHCR
  # --------------------------------------------------

  publish_image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs:
      - lint_typecheck
      - test
      - build
      - container_build
      - release

    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
      sha: ${{ steps.release_meta.outputs.sha }}

    # Normal release:
    # Publish only when semantic-release created a new tag.
    #
    # Manual recovery:
    # An existing release tag can be supplied through workflow_dispatch.
    # All verification jobs run against that tag before publishing.

    if: >-
      always() &&
      needs.lint_typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.container_build.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          needs.release.result == 'success' &&
          needs.release.outputs.released == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        )
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Make sure Git Tag and package.json have exactly the same version.
      - name: Validate release metadata
        id: release_meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          checked_out_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          if [[ "$checked_out_commit" != "$tag_commit" ]]; then
            echo "::error::Checked out commit does not match release tag."
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$package_version" != "$expected_version" ]]; then
            echo "::error::package.json version does not match Git tag."
            echo "Expected: $expected_version"
            echo "Actual: $package_version"
            exit 1
          fi

          node scripts/validate-release.js

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "sha=$checked_out_commit" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=${{ steps.release_meta.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=raw,value=sha-${{ steps.release_meta.outputs.short_sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/realrezasadeghi/Bot
            org.opencontainers.image.title=Academic Scheduling Bot
            org.opencontainers.image.description=Academic Scheduling and Notification Bot
            org.opencontainers.image.version=${{ steps.release_meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_meta.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=academic-scheduling-bot
          cache-to: type=gha,mode=max,scope=academic-scheduling-bot

          provenance: mode=max
          sbom: true


  # --------------------------------------------------
  # 7. Deploy to VPS
  # --------------------------------------------------

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - publish_image

    # Only automatically deploy a new release from master.
    # Manual image recovery must not accidentally roll back production.

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.publish_image.result == 'success' &&
      needs.publish_image.outputs.tag != ''

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      # Checkout the exact release that was published.
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish_image.outputs.tag }}
          persist-credentials: false

      # SSH authentication and deployment.
      - name: Deploy release to VPS
        shell: bash

        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}

          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}

          IMAGE_TAG: ${{ needs.publish_image.outputs.tag }}

        run: |
          set -Eeuo pipefail

          # --------------------------------------------
          # 1. Validate required configuration
          # --------------------------------------------

          : "${SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY}"
          : "${SSH_PASSPHRASE:?Missing VPS_SSH_PASSPHRASE}"
          : "${SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS}"

          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_DEPLOY_PATH:?Missing VPS_DEPLOY_PATH}"
          : "${IMAGE_TAG:?Missing IMAGE_TAG}"

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid VPS_HOST."
            exit 1
          fi

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid VPS_PORT."
            exit 1
          fi

          port_number=$((10#$VPS_PORT))

          if (( port_number < 1 || port_number > 65535 )); then
            echo "::error::VPS_PORT must be between 1 and 65535."
            exit 1
          fi

          if [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid VPS_USER."
            exit 1
          fi

          if [[ ! "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] ||
             [[ "$VPS_DEPLOY_PATH" == *".."* ]]; then
            echo "::error::Invalid VPS_DEPLOY_PATH."
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $IMAGE_TAG"
            exit 1
          fi

          # --------------------------------------------
          # 2. Prepare SSH files
          # --------------------------------------------

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          # Ensure the expected host entry exists.
          ssh-keygen -F "[$VPS_HOST]:$VPS_PORT" \
            -f "$HOME/.ssh/known_hosts" > /dev/null

          # --------------------------------------------
          # 3. Start SSH Agent
          # --------------------------------------------

          cat > "$RUNNER_TEMP/ssh-askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSPHRASE"
          ASKPASS

          chmod 700 "$RUNNER_TEMP/ssh-askpass"

          eval "$(ssh-agent -s)" > /dev/null

          cleanup() {
            ssh-agent -k > /dev/null 2>&1 || true

            rm -f "$HOME/.ssh/id_ed25519"
            rm -f "$HOME/.ssh/known_hosts"
            rm -f "$RUNNER_TEMP/ssh-askpass"
          }

          trap cleanup EXIT

          export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          # Unlock the encrypted private key.
          ssh-add "$HOME/.ssh/id_ed25519" < /dev/null

          # Verify that the key is loaded.
          ssh-add -l > /dev/null

          # Remove secrets from the remaining process environment.
          unset SSH_PRIVATE_KEY
          unset SSH_PASSPHRASE
          unset SSH_ASKPASS
          unset SSH_ASKPASS_REQUIRE
          unset DISPLAY

          echo "SSH private key loaded successfully."

          # --------------------------------------------
          # 4. Configure SSH connection
          # --------------------------------------------

          SSH_OPTS=(
            -p "$VPS_PORT"
            -o IdentityAgent="$SSH_AUTH_SOCK"
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          SCP_OPTS=(
            -P "$VPS_PORT"
            -o IdentityAgent="$SSH_AUTH_SOCK"
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )

          TARGET="${VPS_USER}@${VPS_HOST}"

          # --------------------------------------------
          # 5. Verify VPS
          # --------------------------------------------

          printf -v REMOTE_CHECK \
            'test -d %q && test -w %q && test -f %q && test -r %q && docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1' \
            "$VPS_DEPLOY_PATH" \
            "$VPS_DEPLOY_PATH" \
            "$VPS_DEPLOY_PATH/.env" \
            "$VPS_DEPLOY_PATH/.env"

          echo "Checking VPS deployment environment..."

          ssh "${SSH_OPTS[@]}" "$TARGET" "$REMOTE_CHECK"

          # --------------------------------------------
          # 6. Prepare remote deployment directory
          # --------------------------------------------

          printf -v REMOTE_MKDIR \
            'mkdir -p -- %q' \
            "$VPS_DEPLOY_PATH/deploy"

          ssh "${SSH_OPTS[@]}" "$TARGET" "$REMOTE_MKDIR"

          # --------------------------------------------
          # 7. Upload deployment configuration
          # --------------------------------------------

          echo "Uploading production Compose configuration..."

          scp "${SCP_OPTS[@]}" \
            docker-compose.production.yml \
            "$TARGET:$VPS_DEPLOY_PATH/docker-compose.production.yml"

          echo "Uploading deployment script..."

          scp "${SCP_OPTS[@]}" \
            deploy/deploy.sh \
            "$TARGET:$VPS_DEPLOY_PATH/deploy/deploy.sh"

          printf -v REMOTE_CHMOD \
            'chmod 750 -- %q' \
            "$VPS_DEPLOY_PATH/deploy/deploy.sh"

          ssh "${SSH_OPTS[@]}" "$TARGET" "$REMOTE_CHMOD"

          # --------------------------------------------
          # 8. Execute deployment
          # --------------------------------------------

          echo "Starting deployment of $IMAGE_TAG..."

          printf -v REMOTE_COMMAND \
            'cd %q && ./deploy/deploy.sh %q' \
            "$VPS_DEPLOY_PATH" \
            "$IMAGE_TAG"

          ssh "${SSH_OPTS[@]}" "$TARGET" "$REMOTE_COMMAND"

          echo "Deployment completed successfully."

          {
            echo "### Production deployment successful"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Version: \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
