
name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to verify and republish (e.g. v0.1.1)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12.4.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/realrezasadeghi/bot

# Cancel outdated PR checks, but never cancel an ongoing master release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # --------------------------------------------------
  # 1. Lint and Typecheck
  # --------------------------------------------------

  lint_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck


  # --------------------------------------------------
  # 2. PostgreSQL Integration Tests
  # --------------------------------------------------

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: academic_scheduling
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U academic -d academic_scheduling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://academic:academic@localhost:5432/academic_scheduling
        run: pnpm test


  # --------------------------------------------------
  # 3. Application Build
  # --------------------------------------------------

  build:
    name: Application Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build


  # --------------------------------------------------
  # 4. Docker Build Verification
  # --------------------------------------------------

  container_build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    needs:
      - lint_typecheck
      - test
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Validate Docker image build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          push: false

          cache-from: type=gha,scope=academic-scheduling-bot


  # --------------------------------------------------
  # 5. Semantic Release
  # --------------------------------------------------

  release:
    name: Semantic Release

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    needs:
      - lint_typecheck
      - test
      - build
      - container_build

    runs-on: ubuntu-latest

    concurrency:
      group: semantic-release-master
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.detect_release.outputs.released }}
      tag: ${{ steps.detect_release.outputs.tag }}
      version: ${{ steps.detect_release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Snapshot tags before semantic-release.
      - name: Snapshot existing release tags
        run: |
          LC_ALL=C git tag --list 'v[0-9]*' |
            LC_ALL=C sort > "$RUNNER_TEMP/tags-before.txt"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # Detect the exact tag created by this release execution.
      - name: Detect newly created release
        id: detect_release
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          LC_ALL=C git tag --list 'v[0-9]*' |
            LC_ALL=C sort > "$RUNNER_TEMP/tags-after.txt"

          mapfile -t new_tags < <(
            comm -13 \
              "$RUNNER_TEMP/tags-before.txt" \
              "$RUNNER_TEMP/tags-after.txt"
          )

          if [[ ${#new_tags[@]} -eq 0 ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release was created."
            exit 0
          fi

          if [[ ${#new_tags[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one new release tag."
            exit 1
          fi

          tag="${new_tags[0]}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag: $tag"
            exit 1
          fi

          version="${tag#v}"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "New release detected:"
          echo "Tag: $tag"
          echo "Version: $version"
          echo "Commit: $(git rev-list -n 1 "$tag")"


  # --------------------------------------------------
  # 6. Publish Multi-Architecture Docker Image to GHCR
  # --------------------------------------------------

  publish_image:
    name: Publish Docker Image
    runs-on: ubuntu-latest

    needs:
      - lint_typecheck
      - test
      - build
      - container_build
      - release

    # Normal release:
    # Publish only when semantic-release created a new tag.
    #
    # Manual recovery:
    # An existing release tag can be supplied through workflow_dispatch.
    # All verification jobs run against that tag before publishing.

    if: >-
      always() &&
      needs.lint_typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.container_build.result == 'success' &&
      (
        (
          needs.release.result == 'success' &&
          needs.release.outputs.released == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        )
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Make sure Git Tag and package.json have exactly the same version.
      - name: Validate release metadata
        id: release_meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          checked_out_tag="$(git describe --tags --exact-match)"

          if [[ "$checked_out_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Checked out tag does not match requested release."
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$package_version" != "$expected_version" ]]; then
            echo "::error::package.json version does not match Git tag."
            echo "Expected: $expected_version"
            echo "Actual: $package_version"
            exit 1
          fi

          node scripts/validate-release.js

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=${{ steps.release_meta.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=sha-${{ steps.release_meta.outputs.short_sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/realrezasadeghi/Bot
            org.opencontainers.image.title=Academic Scheduling Bot
            org.opencontainers.image.description=Academic Scheduling and Notification Bot
            org.opencontainers.image.version=${{ steps.release_meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_meta.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=academic-scheduling-bot
          cache-to: type=gha,mode=max,scope=academic-scheduling-bot

          provenance: mode=max
          sbom: true